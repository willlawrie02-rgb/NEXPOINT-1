<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NexPoint Admin — Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..500,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
  /* Status masthead — the page's one big answer. */
  .masthead { display: flex; align-items: center; gap: 14px; margin: 30px 0 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: #C2CAD6; }
  .dot.ok  { background: var(--np-green); box-shadow: 0 0 0 5px rgba(139,197,63,.18); }
  .dot.bad { background: #D64541; box-shadow: 0 0 0 5px rgba(214,69,65,.16); }
  @media (prefers-reduced-motion: no-preference) {
    .dot.bad { animation: pulse 2s var(--ease) infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(214,69,65,.08); } }
  }
  .masthead h1 { font: 700 21px/1.25 var(--font-display); color: var(--fg); letter-spacing: -0.01em; }
  .asof { font-size: 13px; color: var(--fg-2); margin: 0 0 22px 26px; }

  /* Usage meters — real numbers against real limits. */
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .meter { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
           box-shadow: var(--shadow-rest); padding: 16px 18px; }
  .meter .k { font: 600 12px/1 var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
  .meter .v { font: 700 22px/1.2 var(--font-display); color: var(--fg); margin: 8px 0 10px;
              font-variant-numeric: tabular-nums; }
  .meter .v small { font: 500 12.5px/1 var(--font-body); color: var(--fg-2); margin-left: 4px; }
  .meter .bar { height: 5px; border-radius: 3px; background: var(--bg-alt); overflow: hidden; }
  .meter .bar span { display: block; height: 100%; width: 100%; border-radius: 3px; background: var(--np-blue);
                     transform-origin: left; transform: scaleX(0); transition: transform 500ms var(--ease); }
  .meter.warn .bar span { background: #D9A62E; }
  .meter.bad .bar span { background: #D64541; }

  /* Findings */
  .panel { background: var(--surface); border: 1px solid var(--warn-line); border-radius: var(--radius);
           box-shadow: var(--shadow-rest); padding: 18px 20px; margin-bottom: 22px; }
  .panel.bad { border-color: var(--err-line); }
  .panel h2 { font: 600 14.5px/1.3 var(--font-display); color: var(--fg); margin-bottom: 10px; }
  .panel ul { list-style: none; }
  .panel li { padding: 7px 0 7px 26px; position: relative; font-size: 14px; color: var(--fg-1);
              border-bottom: 1px solid var(--border-faint); }
  .panel li:last-child { border-bottom: none; }
  .panel li::before { font-family: 'Material Symbols Outlined'; position: absolute; left: 0; top: 7px; font-size: 17px; }
  .panel li.warn::before { content: "warning"; color: var(--warn-ink); }
  .panel li.bad::before  { content: "error";   color: var(--err-ink); }

  /* Jobs table */
  .jobs-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: var(--shadow-rest); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 600 11.5px/1 var(--font-body); letter-spacing: 0.05em; text-transform: uppercase;
       color: var(--fg-2); padding: 14px 18px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 18px; border-bottom: 1px solid var(--border-faint); color: var(--fg-1); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background var(--t-fast) var(--ease); }
  tbody tr:hover { background: #FAFBFD; }
  td.job { font-weight: 600; color: var(--fg); }
  td.when { color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st { display: inline-block; font: 600 11.5px/1 var(--font-body); letter-spacing: 0.03em;
        padding: 4px 9px; border-radius: 999px; }
  .st-ok   { background: var(--ok-wash);   color: var(--ok-ink); }
  .st-warn { background: var(--warn-wash); color: var(--warn-ink); }
  .st-bad  { background: var(--err-wash);  color: var(--err-ink); }
  .st-idle { background: var(--bg-alt);    color: var(--fg-2); }
</style>
</head>
<body>
<!--
THESIS: The admin is the main site's back office — same light material world,
no separate "app skin". Refuses the dark-panel dashboard the incumbent shipped.
OWN-WORLD: NexPoint light — #F5F7FA ground, white cards on #E3E7ED hairlines,
ink #0E1626, Montserrat headings / Inter body, blue #005CC8 as the one action
accent, green reserved for "go" semantics, horizontal logo in a translucent bar.
STORY: one glance answers "is the automation okay?" — a verdict line first,
usage against limits second, the per-job table for the detail; broken states
look broken (the red dot pulses only while something is failed; meters fill
once on load, and the region shares the standard arrival fade).
FIRST VIEWPORT: brand bar, boards tabs, verdict masthead with status dot,
three usage meters, findings panel when something needs attention.
FORM: user-pinned (match nexpoint.co.uk, light only) — no roll, no seed.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md
-->

<div id="login" class="door" style="display:none">
  <img class="door-logo" src="nexpoint-logo-horizontal.svg" alt="NexPoint">
  <h1>Admin sign in</h1>
  <p>The opportunity board, leads, tasks and engine health.</p>
  <div class="card">
    <form onsubmit="event.preventDefault();doLogin()">
      <input id="email" type="email" placeholder="you@nexpoint.co.uk" autocomplete="username" required>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn-pri" type="submit">Sign in</button>
    </form>
    <div class="err" id="loginErr" role="alert"></div>
  </div>
  <div class="hint">Admin access only — the database admits the allowlist and nobody else.</div>
</div>

<div id="admin" style="display:none">
  <header class="topbar">
    <div class="wrap bar">
      <a class="brandmark" href="index.html">
        <img src="nexpoint-logo-horizontal.svg" alt="NexPoint">
        <span class="admin-tag">Admin</span>
      </a>
      <div class="session">
        <span class="who" id="who"></span>
        <button class="btn btn-gh btn-sm" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <nav class="boards" aria-label="Admin boards">
        <a href="index.html">Briefs</a>
        <a href="leads.html">Leads</a>
        <a href="tasks.html">Tasks</a>
        <a href="health.html" aria-current="page">Health</a>
      </nav>

      <div class="arrive">
        <div class="masthead">
          <span class="dot" id="dot"></span>
          <h1 id="verdict">Checking…</h1>
          <button class="btn btn-gh btn-sm" style="margin-left:auto" onclick="load()"><span class="material-symbols-outlined" aria-hidden="true">refresh</span>Refresh</button>
        </div>
        <p class="asof" id="asof"></p>
        <div class="meters" id="meters"></div>
        <div id="findings"></div>
        <div class="jobs-card" id="jobs">
          <div class="row skeleton" style="border:none;box-shadow:none;margin:0"><div class="bone" style="width:40%"></div><div class="bone" style="width:88%;margin-top:12px"></div><div class="bone" style="width:88%;margin-top:12px"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://synywukadvjpjjxjylwk.supabase.co';
const SUPABASE_KEY='sb_publishable_a2-WFA1i5tqkoHy52_aGzQ_6Yx3xtNo';
const ADMIN_EMAILS=['willlawrie@nexpoint.co.uk','chris@nexpoint.co.uk'];
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const isAdmin=e=>ADMIN_EMAILS.includes((e||'').toLowerCase());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLS={succeeded:'st-ok','succeeded-with-warnings':'st-warn',failed:'st-bad','skipped-because-locked':'st-idle'};

async function boot(){
  const {data}=await sb.auth.getSession();const s=data&&data.session;
  if(s&&isAdmin(s.user.email))showAdmin(s.user);else showLogin(s);
}
function showLogin(session){
  $('login').style.display='block';$('admin').style.display='none';
  if(session&&!isAdmin(session.user.email))$('loginErr').textContent=`${session.user.email} is signed in but not an admin.`;
}
async function doLogin(){
  $('loginErr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
  if(error){$('loginErr').textContent=error.message;return;}
  if(!isAdmin(data.user.email)){$('loginErr').textContent='This account is not on the admin allowlist.';await sb.auth.signOut();return;}
  showAdmin(data.user);
}
async function signOut(){await sb.auth.signOut();location.reload();}
function showAdmin(u){$('login').style.display='none';$('admin').style.display='block';$('who').textContent=u.email;load();}

function ago(iso){
  if(!iso)return '—';
  const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins<60)return `${mins} min ago`;
  const h=Math.round(mins/60); if(h<48)return `${h} h ago`;
  return `${Math.round(h/24)} d ago`;
}

async function load(){
  $('findings').innerHTML='';
  const {data:runs,error}=await sb.from('engine_runs')
    .select('id,job,status,started_at,ended_at').order('started_at',{ascending:false}).limit(300);
  if(error){
    $('dot').className='dot bad';$('verdict').textContent='Cannot read the engine';
    $('findings').innerHTML=`<div class="panel bad"><h2>Database</h2><ul><li class="bad">${esc(error.message)}</li></ul></div>`;
    $('jobs').innerHTML='';
    return;
  }
  const latest={};(runs||[]).forEach(r=>{if(!latest[r.job])latest[r.job]=r;});
  const jobs=Object.values(latest);

  // Usage meters — counted from step details the engine already writes.
  // Tavily: research steps report "N scraped"; Claude sessions: one run of
  // each session job. Limits are set here by Will, not invented.
  const LIMITS={tavily:1000,sessions:60};
  const monthStart=new Date();monthStart.setUTCDate(1);monthStart.setUTCHours(0,0,0,0);
  const since=monthStart.toISOString();
  const {data:steps}=await sb.from('engine_steps')
    .select('run_id,name,detail,recorded_at').gte('recorded_at',since).in('name',['research','search-candidates']);
  let tavily=0;(steps||[]).forEach(st=>{
    const m=/(\d+)\s+scraped/.exec(st.detail||'');if(m)tavily+=parseInt(m[1],10);
    const q=/(\d+)\s+search(?:es)?\b/.exec(st.detail||'');if(q&&st.name==='search-candidates')tavily+=parseInt(q[1],10);
  });
  const monthRuns=(runs||[]).filter(r=>r.started_at>=since);
  const sessionJobs=new Set(['discovery-judge','mmm-deck','summaries','drains','judge']);
  const sessions=monthRuns.filter(r=>[...sessionJobs].some(j=>r.job.includes(j))).length;
  const cloudRuns=monthRuns.length;
  const meter=(k,v,limit,unit)=>{
    const pct=limit?Math.min(100,Math.round(v/limit*100)):0;
    const cls=limit?(pct>=90?'bad':pct>=70?'warn':''):'';
    return `<div class="meter ${cls}"><div class="k">${k}</div>
      <div class="v">${v.toLocaleString()}<small>${limit?'/ '+limit.toLocaleString()+' ':''}${unit}</small></div>
      <div class="bar"><span style="transform:scaleX(${pct/100})"></span></div></div>`;
  };
  $('meters').innerHTML=
    meter('Tavily calls',tavily,LIMITS.tavily,'this month')+
    meter('Claude sessions',sessions,LIMITS.sessions,'runs')+
    meter('Engine runs',cloudRuns,0,'this month');

  // Findings the board can derive itself.
  const bad=jobs.filter(j=>j.status==='failed');
  const warn=jobs.filter(j=>j.status==='succeeded-with-warnings');
  const {count:pendingIntents}=await sb.from('engine_intents')
    .select('id',{count:'exact',head:true}).eq('status','pending');
  const {count:unjudged}=await sb.from('engine_lead_queue')
    .select('id',{count:'exact',head:true}).eq('status','pending').eq('judged',false);

  const findings=[];
  bad.forEach(j=>findings.push(['bad',`${j.job} failed — last run ${ago(j.started_at)}`]));
  warn.forEach(j=>findings.push(['warn',`${j.job} finished with warnings — ${ago(j.started_at)}`]));
  if(pendingIntents)findings.push(['warn',`${pendingIntents} request(s) queued and not yet actioned by the engine`]);
  if(unjudged)findings.push(['warn',`${unjudged} lead(s) waiting on the judge pass — the queue is keyword-only until it runs`]);
  if(LIMITS.tavily&&tavily>=LIMITS.tavily*0.9)findings.push(['bad',`Tavily at ${tavily}/${LIMITS.tavily} this month — the finders will start failing at the cap`]);
  else if(LIMITS.tavily&&tavily>=LIMITS.tavily*0.7)findings.push(['warn',`Tavily at ${tavily}/${LIMITS.tavily} this month`]);

  const isBad=bad.length>0;
  $('dot').className='dot '+(isBad?'bad':'ok');
  $('verdict').textContent=isBad?'Something needs attention':(findings.length?'Running, with warnings':'All clear');
  $('asof').textContent=`${jobs.length} job(s) with run records · checked ${new Date().toLocaleTimeString()}`;
  $('findings').innerHTML=findings.length
    ? `<div class="panel ${isBad?'bad':'warn'}"><h2>Needs attention</h2><ul>${
        findings.map(([k,t])=>`<li class="${k}">${esc(t)}</li>`).join('')}</ul></div>`
    : '';

  $('jobs').innerHTML=jobs.length? `<table><thead><tr>
      <th>Job</th><th>Status</th><th>Last run</th><th>Run</th></tr></thead><tbody>${
    jobs.sort((a,b)=>a.job.localeCompare(b.job)).map(j=>`<tr>
      <td class="job">${esc(j.job)}</td>
      <td><span class="st ${CLS[j.status]||'st-idle'}">${esc(j.status||'running')}</span></td>
      <td class="when">${esc(ago(j.started_at))}</td>
      <td class="when">${esc((j.id||'').slice(-13))}</td>
    </tr>`).join('')}</tbody></table>`
    : `<div class="empty">No run records yet. Jobs write here as soon as the engine runs in the cloud.</div>`;
}
boot();
</script>
</body>
</html>
