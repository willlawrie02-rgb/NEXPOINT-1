/* The company page (plan 071 PR 3): one company's whole record, in the
   arrangement Will approved on 22 October (Pipedrive's): the header card
   with its facts, pills and tags; details down the left (About, People,
   Sites and accounts, Introductions); the timeline on the right. It opens
   by ?id=, ?slug= (a workspace folder), ?org= (an account) or ?person=,
   a contract the Inbox (072) and every other page link to.

   Sites and accounts carries the account controls that left the Accounts
   board (Will, 22 October: Accounts keeps the money only, until Money in
   075): Pause or Resume, Open audit strike, strikes with Cure, Remove from
   the hub or Restore, Delete account behind the typed name, Erase the
   records for a closed or deleted account (plan 069), and Delete user.
   They raise the same intents, with the same payloads, as before. Every
   decision opens in place under what it changes; there are no pop-ups.

   Plan 072 adds Needs you at the head of the right column (every Inbox job
   on the company's accounts, decided in place by jobs.js, `&job=<item_key>`
   scrolling to one), the composer's Task, and Open tasks at the foot of the
   left column. Where the account panel already has the control (Pause,
   Remove, Erase), a job calls that panel's own (D12). */
const esc=NXCRM.esc, ms=NXShell.ms, plural=(n,a,b)=>`${n} ${n===1?a:(b||a+'s')}`;
const ORG_INTENTS=['delete-account','erase-account','pause-org','resume-org','remove-org','restore-org','open-audit-strike','cure-strike','delete-user'];
const CRM_INTENTS=Object.keys(NXCRM.KEYS);
const STRIKE_SOURCE={seeker_check:'Seeker check',audit:'Audit',no_declaration:'No declaration',undeclared_evidence:'Undeclared evidence'};
const LISTING_BADGE={pending:'Waiting for approval',live:'Live',declined:'Declined',hidden:'Hidden'};
const HUB={print:['3D Print Hub','print-hub.html'],mill:['Mill Hub','mill-hub.html']};
/* The score's bands, from the engine's constants (statements.SCORE_BAND_GREEN
   = 80, statements.SCORE_BAND_AMBER = 60). The middle band is neutral: the
   brand has no amber. */
const SCORE_BAND_GREEN=80, SCORE_BAND_AMBER=60;
const TERMS_LAYERS=[['platform','Platform'],['host','Host'],['introduction','Introduction']];
const QUEUE_WORD={approved:'Accepted from Prospects',rejected:'Rejected on Prospects',withdrawn:'Withdrawn from Prospects',blocked:'Blocked on Prospects'};
const BACK={'contacts.html':'Contacts','organisations.html':'Accounts','leads.html':'Prospects','inbox.html':'Inbox',
  'print-hub.html':'3D Print Hub','mill-hub.html':'Mill Hub','dashboard.html':'Dashboard','introductions.html':'Introductions','orders.html':'Orders'};
const none=Promise.resolve({data:[],error:null});
const todayIso=()=>new Date().toISOString().slice(0,10);
const fmt=v=>NXCRM.fmtDate(v);

const UI={open:null,edit:null,tl:'all',tlMax:50,job:null,flashDone:false};
let state='loading', problem='', banners=[];
let C=null;
let A={orgs:[],listings:[],revisions:[],strikes:[],fees:{},terms:{},users:[],versions:{},requests:[]};
let intentById={}, pendingByOrg={}, pendingByStrike={}, pendingByUser={}, pendingByPerson={}, pendingBySite={}, crmOpen=[], doneOrg=[];
/* The intents read, and those on their way since: a press shows queued at once (plan 072). */
let readIntents=[], sending=[], sendSeq=0;
let allCompanies=null;
/* Plan 072: the company's jobs from the inbox view, what their panels read, their open intents, and our tasks for it. */
let jobRows=[], J={problems:[]}, jobPending={}, T={missing:false,error:'',rows:[]};

async function load(){
  banners=[];
  const q=new URLSearchParams(location.search);
  const key={id:q.get('id'),slug:q.get('slug'),org:q.get('org'),person:q.get('person')};
  UI.job=q.get('job');
  const st=await sb.from('crm_settings').select('key,value');
  const missing=!!st.error&&/crm_/.test(st.error.message||'');
  if(st.error&&!missing){state='error';problem=st.error.message;render();return;}
  const imported=!st.error&&(st.data||[]).some(r=>r.key==='imported_at');
  const iq=await sb.from('engine_intents').select('id,type,payload_json,status,result_note,requested_at,requested_by')
    .in('status',['pending','claimed','failed','done']).in('type',[...ORG_INTENTS,...CRM_INTENTS,...NXJOBS.TYPES,...NXJOBS.TASK_TYPES])
    .order('id',{ascending:false}).limit(1000);
  if(iq.error)banners.push(`Could not read the queued changes: ${iq.error.message}.`);
  if((iq.data||[]).length===1000)banners.push('Showing the newest 1,000 intent rows; older ones are not on this page.');
  readIntents=iq.data||[];sending=[];
  watch(readIntents);
  let cid=null;
  if(imported){cid=await findCompany(key);if(cid===false)return;}
  if(cid!=null)await loadCompany(cid);
  if(state==='error')return;
  if(!C){
    state=missing?'missing':!imported?'empty':'unknown';
    if(key.org){await loadAccounts([key.org]);await loadJobs([key.org]);}
    render();return;
  }
  await loadJobs(C.sites.map(s=>s.org_id).filter(Boolean));
  state='ready';render();
}

/* Needs you: the inbox view's rows on this company's accounts, oldest first,
   and what their panels read; our open tasks for the company. A missing
   column or table names its migration and leaves the rest of the page. */
const isMissing=e=>!!e&&/does not exist|schema cache|Could not find/i.test(e.message||'');
async function loadJobs(orgIds){
  jobRows=[];J={problems:[]};T={missing:false,error:'',rows:[]};
  const [iq,tq]=await Promise.all([
    orgIds.length?sb.from('inbox').select('*').in('org_id',orgIds).order('created_at',{ascending:true}).limit(200):none,
    C?sb.from('crm_tasks').select('id,title,company_id,due_on,source,created_at,created_by,done_at,done_by').eq('company_id',C.id).is('done_at',null).order('id',{ascending:true}).limit(200):none,
  ]);
  if(iq.error)banners.push(isMissing(iq.error)?'Migration 0077 has not been applied: Needs you shows the Inbox’s jobs here once it is.':`Could not read this company’s jobs: ${iq.error.message}.`);
  jobRows=iq.data||[];
  if(tq.error){if(isMissing(tq.error))T.missing=true;else T.error=tq.error.message;}
  else T.rows=tq.data||[];
  if(jobRows.length){
    J=await NXJOBS.read(sb,jobRows,{orgIds});
    J.problems.forEach(p=>banners.push(p));
  }
}

async function findCompany(key){
  if(key.id)return Number(key.id)||null;
  let r=null;
  if(key.slug)r=await sb.from('crm_company_folders').select('company_id,gone_at').eq('slug',key.slug);
  else if(key.org)r=await sb.from('crm_sites').select('company_id').eq('org_id',key.org);
  else if(key.person)r=await sb.from('crm_people').select('company_id').eq('id',Number(key.person));
  if(!r)return null;
  if(r.error){state='error';problem=r.error.message;render();return false;}
  const row=(r.data||[]).find(x=>!x.gone_at)||(r.data||[])[0];
  return row&&row.company_id!=null?row.company_id:null;
}

async function loadCompany(cid){
  C=null;
  const cq=await sb.from('crm_companies').select('*').eq('id',cid).maybeSingle();
  if(cq.error){state='error';problem=cq.error.message;render();return;}
  if(!cq.data)return;
  const [fq,dq,sq,pq,tq,lq,evq,mq,nq]=await Promise.all([
    sb.from('crm_company_folders').select('id,area,slug,is_primary,gone_at').eq('company_id',cid),
    sb.from('crm_company_domains').select('id,domain,source,retired_at').eq('company_id',cid),
    sb.from('crm_sites').select('id,org_id,name,town,country').eq('company_id',cid).order('id',{ascending:true}),
    sb.from('crm_people').select('id,company_id,site_id,name,role,phones,notes,kind,position,user_id,archived_at,archived_reason').eq('company_id',cid).order('position',{ascending:true}),
    sb.from('crm_tags').select('id,grp,label,position,active'),
    sb.from('crm_company_tags').select('id,tag_id,position,retired_at').eq('company_id',cid),
    sb.from('crm_events').select('id,person_id,kind,detail,by,at').eq('company_id',cid).order('at',{ascending:false}).limit(500),
    sb.from('crm_email_index').select('id,path,sent_at,subject,from_text,direction,internet_message_id,web_links,gone_at').eq('company_id',cid).order('sent_at',{ascending:false}).limit(500),
    sb.from('crm_note_index').select('id,path,dated,title,body,gone_at').eq('company_id',cid).order('dated',{ascending:false}).limit(500),
  ]);
  for(const [what,e] of [['folders',fq.error],['domains',dq.error],['sites',sq.error],['people',pq.error],['tags',tq.error||lq.error],
    ['changes',evq.error],['filed emails',mq.error],['notes',nq.error]])if(e)banners.push(`Could not read the ${what}: ${e.message}.`);
  const people=pq.data||[], ids=people.map(p=>p.id), folders=(fq.data||[]).filter(f=>!f.gone_at);
  const slugs=[...new Set(folders.map(f=>f.slug))];
  const [eq,qq,prq]=await Promise.all([
    ids.length?sb.from('crm_person_emails').select('id,person_id,email,is_primary,retired_at').in('person_id',ids):none,
    slugs.length?sb.from('engine_lead_queue').select('id,company,status,prospect_type,sector,company_type,proposed_at,decided_at,decided_by,source').in('company',slugs):none,
    slugs.length?sb.from('prospect_notes').select('id,company,body,by,at').in('company',slugs):none,
  ]);
  for(const [what,e] of [['addresses',eq.error],['Prospects history',qq.error],['Prospects notes',prq.error]])if(e)banners.push(`Could not read the ${what}: ${e.message}.`);
  const tags={};(tq.data||[]).forEach(t=>{tags[t.id]=t;});
  const emails={};(eq.data||[]).filter(e=>!e.retired_at).sort((a,b)=>(b.is_primary?1:0)-(a.is_primary?1:0)).forEach(e=>{(emails[e.person_id]=emails[e.person_id]||[]).push(e.email);});
  C={company:cq.data,id:cq.data.id,folders,primary:folders.find(f=>f.is_primary)||folders[0]||null,
     domains:(dq.data||[]).filter(d=>!d.retired_at),sites:sq.data||[],people,emails,tags,tagList:tq.data||[],
     links:(lq.data||[]).filter(l=>!l.retired_at).sort((a,b)=>a.position-b.position),
     events:evq.data||[],mail:(mq.data||[]).filter(m=>!m.gone_at),notes:(nq.data||[]).filter(n=>!n.gone_at),
     capped:[[mq,'filed emails'],[evq,'changes'],[nq,'notes']].filter(([q])=>(q.data||[]).length===500).map(([,w])=>w),
     queue:(qq.data||[]).slice().sort((a,b)=>String(b.proposed_at).localeCompare(String(a.proposed_at))),pnotes:prq.data||[]};
  await loadAccounts(C.sites.map(s=>s.org_id).filter(Boolean));
}

async function loadCompanyNames(){
  if(allCompanies)return allCompanies;
  const r=await NXCRM.readAll(()=>sb.from('crm_companies').select('id,name,archived_at').order('name',{ascending:true}));
  if(r.error){NXShell.toast(`Could not read the companies to move to: ${r.error.message}`);return null;}

async function loadAccounts(orgIds){
  A={orgs:[],listings:[],revisions:[],strikes:[],fees:{},terms:{},users:[],versions:{},requests:[]};
  if(!orgIds.length)return;
  const [oq,lsq,skq,odq,taq,tvq,upq,srq]=await Promise.all([
    sb.from('organisations').select('*').in('id',orgIds),
    sb.from('listings').select('id,org_id,hub,status,live_revision_id').in('org_id',orgIds),
    sb.from('strikes').select('*').in('org_id',orgIds),
    sb.from('orders').select('org_provider,value,fee_rate,currency,confirmed_at,invoiced_at').in('org_provider',orgIds),
    sb.from('terms_acceptances').select('org_id,context,accepted_at,terms_version_id,user_id').in('org_id',orgIds),
    sb.from('terms_versions').select('id,layer,version'),
    sb.from('member_profiles').select('user_id,org_id,name,email,email_confirmed_at,created_at').in('org_id',orgIds),
    sb.from('seeker_requests').select('id,org_id,hub,status,created_at').in('org_id',orgIds),
  ]);
  for(const [what,e] of [['accounts',oq.error],['listings',lsq.error],['strikes',skq.error],['fees owed',odq.error],
    ['terms',taq.error||tvq.error],['users',upq.error],['requests',srq.error]])if(e)banners.push(`Could not read the ${what}: ${e.message}.`);
  A.orgs=oq.data||[];A.listings=lsq.data||[];A.strikes=skq.data||[];A.users=upq.data||[];A.requests=srq.data||[];
  (odq.data||[]).forEach(o=>{
    if(!o.confirmed_at||o.invoiced_at)return;
    const m=A.fees[o.org_provider]||(A.fees[o.org_provider]={}), cur=o.currency||'GBP';
    m[cur]=(m[cur]||0)+Number(o.value||0)*Number(o.fee_rate||0);
  });
  (tvq.data||[]).forEach(v=>{A.versions[v.id]=v;});
  A.accepts=taq.data||[];
  indexTerms(taq.data||[],tvq.data||[],A.users);
  const lids=A.listings.map(l=>l.id);
  if(lids.length){
    const rq=await sb.from('listing_revisions').select('id,listing_id,town,status,decided_at,decided_by,submitted_at').in('listing_id',lids);
    if(rq.error)banners.push(`Could not read the listing history: ${rq.error.message}.`);
    A.revisions=rq.data||[];
  }
}

/* The newest acceptance per layer for each account, the signer named by
   user id (the Accounts board's rule, plan 052 item 17). */
function indexTerms(accepts,versions,people){
  A.terms={};
  const layerOf={},who={};
  versions.forEach(v=>{layerOf[v.id]=v;});
  people.forEach(p=>{who[p.user_id]=(p.name||'').trim()||(p.email||'').trim();});
  accepts.forEach(a=>{
    const v=layerOf[a.terms_version_id];if(!a.org_id||!v)return;
    const byLayer=A.terms[a.org_id]||(A.terms[a.org_id]={});
    const cur=byLayer[v.layer];
    if(!cur||new Date(a.accepted_at)>new Date(cur.at))byLayer[v.layer]={version:v.version,at:a.accepted_at,by:who[a.user_id]||''};
  });
}

/* The newest intent per row decides what it shows (ascending id, last write
   wins; a done one clears it). Done account intents become timeline
   entries; Contacts intents still open are shown as queued. */
/* The newest intent per row decides what it shows (ascending id, last write
   wins; a done one clears it). Done account intents become timeline entries;
   a Contacts change still open is shown once, keyed by what it changes. */
const crmKey=(i,p)=>i.type==='edit-company'?`co:${p.company_id}`
  :i.type==='tag-company'?`tag:${p.company_id}:${p.tag_id!=null?p.tag_id:String(p.label||'').toLowerCase()}`
  :i.type==='add-person'||i.type==='add-site'?`${i.type}:${p.company_id}:${String(p.name||'').toLowerCase()}`:null;
function watch(rows){
  intentById={};pendingByOrg={};pendingByStrike={};pendingByUser={};pendingByPerson={};pendingBySite={};doneOrg=[];jobPending={};
  const open={};
  rows.slice().sort((a,b)=>a.id-b.id).forEach(i=>{
    intentById[i.id]=i;
    const p=i.payload_json||{};
    /* A job's and a task's newest open intent, keyed as jobs.js looks them up. */
    const jk=NXJOBS.TYPES.includes(i.type)||NXJOBS.TASK_TYPES.includes(i.type)?NXJOBS.intentKey(i):null;
    if(jk!=null){if(i.status==='done')delete jobPending[jk];else jobPending[jk]=i;}
    if(i.status==='done'&&ORG_INTENTS.includes(i.type))doneOrg.push(i);
    let map=null,key=null;
    if(i.type==='delete-user'){map=pendingByUser;key=p.user_id;}
    else if(p.strike_id!=null){map=pendingByStrike;key=p.strike_id;}
    else if(ORG_INTENTS.includes(i.type)){map=pendingByOrg;key=p.org_id;}
    else if(i.type==='edit-person'){map=pendingByPerson;key=p.person_id;}
    else if(i.type==='edit-site'){map=pendingBySite;key=p.site_id;}
    else if(CRM_INTENTS.includes(i.type)){map=open;key=crmKey(i,p);}
    if(map&&key!=null){if(i.status==='done')delete map[key];else map[key]=i;}
  });
  crmOpen=Object.values(open);
}

/* ---------- the account panel, shared by an adopted site and an account Contacts has not met yet ---------- */
function delMatches(typed,name){
  const t=String(typed||'').trim().toLowerCase(),n=String(name||'').trim().toLowerCase();
  return t!==''&&t===n;
}
const retentionDue=o=>!!o.retention_until&&String(o.retention_until).slice(0,10)<=todayIso();
function eraseCheck(){
  const go=$('erGo'), o=orgById(go&&go.dataset.orgId);
  if(go&&o)go.disabled=!eraseReady(($('erName')||{}).value,o.name,($('erWhy')||{}).value,!retentionDue(o));
}
function eraseReady(typed,name,reason,beforeDate){
  return delMatches(typed,name)&&(!beforeDate||String(reason||'').trim()!=='');
}
const orgById=id=>A.orgs.find(o=>o.id===id);
/* A seeker request is known by its PS- or MS- code everywhere (plan 067). */
const REQUEST_WORD={open:'open',picked:'picked',desk:'with the desk',declined:'declined',closed:'closed'};
function requestsLine(reqs){
  return `<span style="display:flex;flex-direction:column;gap:2px">${reqs.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,5)
    .map(r=>`<span>${r.hub==='mill'?'MS-':'PS-'}${String(r.id).padStart(4,'0')}, ${esc(REQUEST_WORD[r.status]||r.status)}</span>`).join('')}</span>`;
}
const userName=uid=>{const u=A.users.find(x=>x.user_id===uid);return u?(u.name||u.email):'';};

/* A queued intent replaces the buttons it came from; a failed one sits
   above them with Try again, never instead of them (plan 024). */
function manageFor(q,fallback){
  if(q&&q.status==='failed')return `<div class="fail-line"><span>Failed: ${esc(NXJOBS.sentence(q.result_note))}</span><button type="button" class="btn sm quiet" data-act="retry" data-intent="${esc(q.id)}">Try again</button></div>${fallback}`;
  if(q)return '<span class="status-line">Queued, moments away.</span>';
  return fallback;
}
const btn=(act,label,icon,data,cls)=>`<button type="button" class="btn sm${cls?' '+cls:''}" data-act="${act}"${Object.entries(data||{}).map(([k,v])=>` data-${k}="${esc(v)}"`).join('')}>${icon?ms(icon,'sm'):''}${label}</button>`;
const cancel=()=>'<button type="button" class="btn sm quiet" data-act="closeUi">Cancel</button>';
const choice=(text,inner)=>`<div class="inline-choice"><span>${text}</span>${inner}</div>`;
/* A destructive choice: the words, the typed name full width, then the action and Cancel on one row. */
const typed=(text,fields,buttons)=>`<div class="inline-choice typed"><span>${text}</span>${fields}<span class="actions">${buttons}</span></div>`;
const input=(id,ph,v)=>`<label class="sr" for="${id}">${esc(ph)}</label><input class="input" id="${id}" placeholder="${esc(ph)}" value="${esc(v||'')}">`;

function stateWord(o){
  const s=NXCRM.orgState(o);
  if(s==='on')return '<span class="st ok">On the portal</span>';
  if(s==='paused')return '<span class="st err">Paused</span>';
  if(s==='removed')return '<span class="st">Removed from the hub</span>';
  if(s==='closed')return `<span class="st">${ms('no_accounts')}Closed by the account</span>`;
  if(s==='deleted')return '<span class="st">Deleted</span>';
  return '<span class="st">Records erased</span>';
}
function subLine(o){
  const s=o.sub_status||'none';
  if(s==='none'&&!o.sub_period)return 'No membership yet';
  const rate=o.sub_rate_gbp!=null?`, £${Number(o.sub_rate_gbp).toLocaleString('en-GB')}`:'';
  const pill=s==='active'?'<span class="st ok">Paid</span>':s==='hidden'?'<span class="st err">Unpaid, hidden</span>':s==='overdue'?'<span class="st">Overdue</span>':'';
  return `${esc((o.sub_period==='monthly'?'Monthly':'Annual')+rate)}${o.founding?' <span class="tag mini">Founding</span>':''} ${pill}`;
}
function scoreLine(o){
  if(o.score==null)return '<span class="st">Not scored yet</span>';
  const score=Number(o.score), d=o.score_detail||{};
  const tone=score>=SCORE_BAND_GREEN?'ok':score>=SCORE_BAND_AMBER?'':'err';
  const lines=[d.months_due!=null?`${d.months_due} month(s) owed a declaration, ${d.missing||0} missing, ${d.late||0} late`:'',
    d.uncured_strikes!=null?`${d.uncured_strikes} uncured strike(s)`:''].filter(Boolean).join('; ');
  return `<span class="st${tone?' '+tone:''}" title="${esc(lines||'No breakdown recorded.')}">${esc(score)}</span>${o.score_computed_at?` <span class="muted-t">computed ${esc(fmt(o.score_computed_at))}</span>`:''}`;
}
function feesLine(orgId){
  const parts=Object.entries(A.fees[orgId]||{});
  if(!parts.length)return '<span class="muted-t">None owed</span>';
  return parts.map(([cur,amt])=>{
    try{return esc(amt.toLocaleString('en-GB',{style:'currency',currency:cur,minimumFractionDigits:0,maximumFractionDigits:2}));}
    catch(e){return `${esc(cur)} ${esc(amt.toFixed(2))}`;}
  }).join(', ');
}
/* One line per acceptance: layers accepted together (one version, one day, one signer) share it. */
const TERMS_WORD={platform:'Platform terms',host:'Host Agreement',introduction:'Introduction terms'};
function termsLines(orgId){
  const by=A.terms[orgId]||{}, groups=[];
  TERMS_LAYERS.filter(([k])=>by[k]).forEach(([k])=>{
    const t=by[k], key=[t.version,String(t.at).slice(0,10),t.by].join('|'), g=groups.find(x=>x.key===key);
    if(g)g.names.push(TERMS_WORD[k]);else groups.push({key,names:[TERMS_WORD[k]],t});
  });
  const out=groups.map(g=>`<span>${esc(g.names.join(' and '))} ${esc(g.t.version)}, accepted ${esc(fmt(g.t.at))} by ${esc(g.t.by||'a user no longer on the account')}</span>`);
  if(!by.platform)out.unshift('<span class="st err">Platform terms not accepted</span>');
  return `<span style="display:flex;flex-direction:column;gap:2px">${out.join('')}</span>`;
}
function listingsLine(orgId){
  const mine=A.listings.filter(l=>l.org_id===orgId).sort((a,b)=>(a.hub>b.hub?-1:1));
  if(!mine.length)return '<span class="muted-t">None</span>';
  return mine.map(l=>{const h=HUB[l.hub]||[l.hub,'dashboard.html'];
    return `<a class="linkish blue" href="${h[1]}">${esc(h[0])}</a> <span class="st${l.status==='live'?' ok':l.status==='hidden'?' err':l.status==='pending'?' info':''}">${esc(LISTING_BADGE[l.status]||l.status)}</span>`;}).join(' ');
}
function usersBlock(o){
  const users=A.users.filter(u=>u.org_id===o.id);
  if(!users.length)return '<span class="muted-t">None yet</span>';
  const live=!['deleted','erased','closed'].includes(NXCRM.orgState(o));
  return `<span class="site-users">${users.map(u=>{
    const q=pendingByUser[u.user_id];
    const del=live?manageFor(q,btn('deleteUser','Delete user','',{user:u.user_id},'danger')):'';
    return `<span class="mini user-row"><span><span class="strong" title="${esc(u.email)}">${esc(u.name||u.email)}</span>${u.email_confirmed_at?'':'<span class="item-sub">Not confirmed</span>'}</span>${del}</span>`+
      (UI.open==='deluser:'+u.user_id?deleteUserChoice(u,users.length):'');}).join('')}</span>`;
}
function deleteUserChoice(u,count){
  const o=orgById(u.org_id)||{}, who=u.name||u.email, acct=o.name||'their account';
  const text=count<=1
    ?`Delete ${esc(who)} (${esc(u.email)})? They are the only user of ${esc(acct)}, so the account is deleted too. Its introductions, declarations, statements and agreements stay, anonymised, because fees and invoice records outlive the account. This cannot be undone.`
    :`Delete ${esc(who)} (${esc(u.email)})? Their sign-in is removed and the rest of ${esc(acct)}'s users stay. This cannot be undone.`;
  return choice(text,btn('confirmDeleteUser','Delete user','',{user:u.user_id},'danger')+cancel());
}
function strikesBlock(o){
  const mine=A.strikes.filter(s=>s.org_id===o.id), open=mine.filter(s=>!s.cured_at), cured=mine.length-open.length;
  if(!open.length)return cured?`<p class="picker-note">${plural(cured,'strike')} cured.</p>`:'';
  return `<div>${open.map(s=>{
    const late=s.cure_by&&String(s.cure_by)<todayIso();
    const act=manageFor(pendingByStrike[s.id],btn('cureStrike','Cure','',{strike:s.id}));
    const what=[STRIKE_SOURCE[s.source]||s.source,s.notes,s.order_ref].filter(Boolean).map(x=>esc(String(x).replace(/\.$/,''))).join('. ');
    return `<div class="mini strike-row"><span><span class="strong">${ms('flag','sm')}Strike, ${esc(fmt(s.opened_at))}</span>`+
      `<span class="item-sub wrap">${what}. <span${late?' class="late"':''}>Cure by ${esc(fmt(s.cure_by))}</span></span></span>${act}</div>`+
      (UI.open==='cure:'+s.id?choice('How was it cured? Kept on the strike.',input('cu-note','How it was cured (optional)')+btn('confirmCure','Cure the strike','',{strike:s.id},'primary')+cancel()):'');
  }).join('')}${cured?`<p class="picker-note">${plural(cured,'more strike')} cured.</p>`:''}</div>`;
}
function accountBlock(o){
  const s=NXCRM.orgState(o), q=pendingByOrg[o.id];
  const kv=rows=>`<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  if(s==='erased')return kv([['Erased',esc(fmt(o.erased_at))]])+'<p class="picker-note">A blank stub, kept while a record another account still needs points at it. It goes with that record; nothing more can be done to it.</p>';
  const rows=[];
  if(s==='closed'){
    rows.push(['Closed',`${esc(fmt(o.closed_at))}, by ${esc(userName(o.closed_by)||'the account holder')}`]);
    rows.push(['Records kept',o.retention_until?(retentionDue(o)?'<span class="st">Retention period over</span>':`Until ${esc(NXCRM.fmtDate(o.retention_until,new Date(0)))}`):'Until a date the engine stamps at its next 06:15 run']);
    rows.push(['Reopen','Only by the account holder, from the account page']);
    rows.push(['Fees owed',feesLine(o.id)]);
  }else if(s==='deleted'){
    rows.push(['Deleted',`${esc(fmt(o.deleted_at))}: kept for its fees and invoices`]);
    rows.push(['Fees owed',feesLine(o.id)]);
    if(o.retention_until)rows.push(['Records kept',retentionDue(o)?'<span class="st">Retention period over</span>':`Until ${esc(NXCRM.fmtDate(o.retention_until,new Date(0)))}`]);
  }else{
    if(s==='paused'||s==='removed'){
      const who=s==='paused'?o.paused_by:o.removed_by, why=s==='paused'?o.paused_reason:o.removed_reason, when=s==='paused'?o.hidden_at:o.removed_at;
      rows.push([s==='paused'?'Paused':'Removed',`<span style="display:flex;flex-direction:column;gap:2px"><span>${esc(fmt(when))}${who?', by '+esc(NXShell.personOf(who)):''}</span>${why?`<span class="muted-t">${esc(why)}</span>`:''}</span>`]);
    }
    rows.push(['Listings',listingsLine(o.id)]);
    const reqs=A.requests.filter(r=>r.org_id===o.id);
    if(reqs.length)rows.push(['Requests',requestsLine(reqs)]);
    rows.push(['Membership',`${subLine(o)} <a class="linkish blue" href="organisations.html">Record payment on Accounts</a>`]);
    rows.push(['Score',scoreLine(o)]);
    rows.push(['Fees owed',feesLine(o.id)]);
  }
  rows.push(['Terms',termsLines(o.id)]);
  rows.push(['Users',usersBlock(o)]);
  let h=kv(rows)+strikesBlock(o);
  const del=btn('deleteOrg','Delete account','delete',{'org-id':o.id},'danger');
  const erase=retentionDue(o)?btn('eraseOrg','Erase the records','auto_delete',{'org-id':o.id},'danger'):btn('eraseOrg','Erase the records early','auto_delete',{'org-id':o.id},'danger');
  let buttons='';
  if(s==='on')buttons=btn('pauseOrg','Pause','pause_circle',{'org-id':o.id})+btn('openAuditStrike','Open audit strike','flag',{'org-id':o.id})+btn('removeOrg','Remove from the hub','remove_circle',{'org-id':o.id})+del;
  else if(s==='paused')buttons=btn('resumeOrg','Resume','play_circle',{'org-id':o.id})+btn('openAuditStrike','Open audit strike','flag',{'org-id':o.id})+btn('removeOrg','Remove from the hub','remove_circle',{'org-id':o.id})+del;
  else if(s==='removed')buttons=btn('restoreOrg','Restore to the hub','undo',{'org-id':o.id})+del;
  else if(s==='closed')buttons=del+erase;
  else if(s==='deleted'&&retentionDue(o))buttons=erase;
  if(buttons)h+=`<div class="panel-actions acct-actions"><div class="actions">${manageFor(q,buttons)}</div></div>`;
  h+=orgChoice(o);
  if(s==='on'||s==='paused')h+='<p class="picker-note">Pausing for strikes is always a person’s decision. Only the day-14 payment hide is automatic.</p>';
  return h;
}
function orgChoice(o){
  const id=o.id, name=esc(o.name||'this account');
  if(UI.open==='pause:'+id)return choice(`Why is ${name} being paused? Seekers stop seeing it and the desk stops routing to it; the record and its listings stay.`,input('pa-why','Reason, kept on the account')+btn('confirmPause','Pause','',{'org-id':id},'primary')+cancel());
  if(UI.open==='resume:'+id)return choice(`Resume ${name}? It goes back into search and the desk’s pickers straight away.`,btn('confirmResume','Resume','',{'org-id':id},'primary')+cancel());
  if(UI.open==='remove:'+id)return choice(`Why is ${name} being removed from the hub? Its people can still sign in to read, and can no longer act; the record is kept and you can restore it.`,input('rm-why','Reason, kept on the account')+btn('confirmRemove','Remove from the hub','',{'org-id':id},'danger')+cancel());
  if(UI.open==='restore:'+id)return choice(`Restore ${name} to the hub? A pause recorded before the removal stands until you resume it.`,btn('confirmRestore','Restore to the hub','',{'org-id':id},'primary')+cancel());
  if(UI.open==='audit:'+id)return choice(`Why is an audit strike being opened against ${name}? Kept on the strike.`,input('au-why','Reason, kept on the strike')+btn('confirmAudit','Open audit strike','',{'org-id':id},'danger')+cancel());
  if(UI.open==='del:'+id)return typed('Deleting removes every user and cannot be undone. Fees and invoices are kept. Type the name to confirm.',
    input('delName',o.name||''),`<button type="button" class="btn sm danger" id="delGo" disabled data-act="confirmDelete" data-org-id="${esc(id)}">Delete account</button>`+cancel());
  if(UI.open==='erase:'+id){
    const before=!retentionDue(o);
    const until=o.retention_until?esc(NXCRM.fmtDate(o.retention_until,new Date(0))):'the date the engine stamps';
    return typed(before?`Erasing before ${until} departs from Platform Terms §7 and cannot be undone. Type the name and give a reason.`
        :'The retention period is over. Erasing cannot be undone; a record another account still needs stays until its own retention runs. Type the name to confirm.',
      input('erName',o.name||'')+(before?input('erWhy','Reason, kept on the intent'):''),
      `<button type="button" class="btn sm danger" id="erGo" disabled data-act="confirmErase" data-org-id="${esc(id)}">Erase the records</button>`+cancel());
  }
  return '';
}

/* ---------- the page ---------- */
const tagsOf=grp=>C.links.map(l=>C.tags[l.tag_id]).filter(t=>t&&t.grp===grp);
const placeOf=()=>{const s=C.sites.find(x=>x.town||x.country);return s?[s.town,s.country].filter(Boolean).join(', '):'';};
const hostOf=w=>String(w||'').replace(/^https?:\/\//i,'').replace(/\/$/,'');
const lastMail=()=>C.mail.reduce((m,e)=>e.sent_at&&(!m||e.sent_at>m)?e.sent_at:m,null);
const queueRow=()=>C.queue[0]||null;

function backLink(){
  let href='contacts.html', label='Contacts';
  try{
    const r=new URL(document.referrer);
    const page=r.pathname.split('/').pop();
    if(r.origin===location.origin&&r.pathname.startsWith('/admin/')&&BACK[page]){href=page+r.search;label=BACK[page];}
  }catch(e){}
  return `<a class="btn quiet back" href="${esc(href)}">${ms('arrow_back','sm')}Back to ${esc(label)}</a>`;
}

function headerCard(){
  const c=C.company, kind=NXCRM.kindLabel(c), q=queueRow(), last=lastMail();
  const facts=[placeOf()?`<span>${ms('location_on')}${esc(placeOf())}</span>`:'',
    q&&q.company_type?`<span>${ms('category')}${esc(q.company_type)}</span>`:'',
    /^https?:\/\//i.test(c.website||'')?`<a href="${esc(c.website)}" target="_blank" rel="noopener noreferrer">${ms('language')}${esc(hostOf(c.website))}</a>`:(C.domains[0]?`<span>${ms('language')}${esc(C.domains[0].domain)}</span>`:''),
    `<span>${ms('schedule')}${last?'Last email '+esc(fmt(last)):'No email filed yet'}</span>`].filter(Boolean).join('');
  const pills=A.orgs.map(NXCRM.accountPill).join('');
  let h=`<section class="co-head"><div class="co-title"><div><div class="co-name-row"><h1>${esc(c.name)}</h1><span class="kindb">${esc(kind)}</span></div>`+
    `<div class="co-sub">${facts}</div></div><div class="co-actions"><div class="pills">${pills}</div>`+
    `<button type="button" class="btn sm" data-act="openUi" data-ui="editco">${ms('edit','sm')}Edit company</button></div></div>`;
  if(UI.open==='editco')h+=editCompany();
  h+=tagRow()+'</section>';
  return h;
}
function editCompany(){
  const c=C.company, folder=C.folders.length>0;
  let h=`<div class="picker"><div class="form-grid"><div class="field"><label for="ec-name">Name</label><input class="input" id="ec-name" value="${esc(c.name)}"></div>`+
    `<div class="field"><label for="ec-web">Website</label><input class="input" id="ec-web" value="${esc(c.website||'')}" placeholder="https://example.com"></div>`+
    `<div class="field"><label for="ec-dom">Domains, separated by commas</label><input class="input" id="ec-dom" value="${esc(C.domains.map(d=>d.domain).join(', '))}"></div></div>`+
    `<div class="composer-row"><span class="picker-note">${folder?'The engine writes the name into the workspace profile.':'No workspace folder: the change stays in Contacts.'}</span><span class="actions">${btn('saveCompany','Save the company','',{},'primary')}${cancel()}</span></div>`;
  if(!folder)h+=c.archived_at
    ?`<div class="inline-choice"><span>Archived${c.archived_reason?': '+esc(c.archived_reason):''}.</span>${btn('restoreCompany','Restore the company','undo',{})}</div>`
    :`<div class="inline-choice">${input('ec-why','Reason to archive, for example: ceased trading')}${btn('archiveCompany','Archive the company','archive',{})}</div>`;
  return h+'</div>';
}
function tagRow(){
  const q=queueRow(), fit=tagsOf('fit'), topics=tagsOf('topic');
  let h='<div class="tagrow">';
  if(q&&q.prospect_type)h+=`<div class="tg"><span class="tg-label">How we know them</span><span class="tg-vals"><span class="tag">${esc(q.prospect_type)}</span></span></div>`;
  h+=`<div class="tg"><span class="tg-label">Fit</span><span class="tg-vals">${fit.map(t=>NXCRM.fitTag(t.label)).join('')}<button type="button" class="tag empty" data-act="openUi" data-ui="fit">${fit.length?'Change':'Add'}</button></span></div>`;
  h+=`<div class="tg"><span class="tg-label">Topics</span><span class="tg-vals">${topics.map(t=>`<span class="tag">${esc(t.label)}<button type="button" class="x" data-act="untag" data-tag="${esc(t.id)}" aria-label="Take off ${esc(t.label)}">${ms('close')}</button></span>`).join('')}<button type="button" class="tag empty" data-act="openUi" data-ui="topic">Add</button></span></div>`;
  const ro=[q&&q.sector,q&&q.company_type].filter(Boolean);
  h+=`<div class="tg"><span class="tg-label">Sector and type</span><span class="tg-vals">${ro.length?ro.map(x=>`<span class="tag ro" title="Set on the Prospects page">${esc(x)}</span>`).join(''):'<span class="tag ro">Not set</span>'}</span></div></div>`;
  if(UI.open==='fit'){
    const fits=C.tagList.filter(t=>t.grp==='fit'&&t.active!==false).sort((a,b)=>a.position-b.position), on=new Set(fit.map(t=>t.id));
    h+=`<div class="picker"><span class="tg-label">Fit, from the fixed list</span><div class="picker-opts">${fits.map(t=>`<button type="button" class="opt" data-act="toggleFit" data-tag="${esc(t.id)}" aria-pressed="${on.has(t.id)}">${esc(t.label)}</button>`).join('')}</div>`+
      `<div class="composer-row"><span class="picker-note">Each press is queued for the engine at once.</span>${btn('closeUi','Done','',{})}</div></div>`;
  }
  if(UI.open==='topic')h+=`<div class="inline-choice">${input('tp-new','New topic tag, for example Lamination')}${btn('addTopic','Add the tag','',{},'primary')}${cancel()}</div>`;
  const queued=crmOpen.filter(i=>(i.payload_json||{}).company_id===C.id);
  if(queued.length)h+=`<div class="hint">${ms('schedule')}<span>${queued.map(queuedWords).join(' ')}</span></div>`;
  return h;
}
function queuedWords(i){
  const p=i.payload_json||{}, tag=p.tag_id!=null?(C.tags[p.tag_id]||{}).label:p.label;
  const what=i.type==='tag-company'?(p.on?`tag it ${tag}`:`take off the tag ${tag}`)
    :i.type==='add-person'?`add ${p.name}`:i.type==='add-site'?`add the site ${p.name}`:'change the company';
  return i.status==='failed'?`Could not ${esc(what)}: ${esc(NXJOBS.sentence(i.result_note||'no reason recorded'))}`:`Queued for the engine: ${esc(what)}.`;
}
function aboutPanel(){

  const row=p=>{

      `<span class="person-role">${esc(line)}</span>${q&&q.status==='failed'?`<span class="person-role" style="color:var(--err-ink)">Failed: ${esc(NXJOBS.sentence(q.result_note))}</span>`:''}</div>`+
      (queued?'<span class="status-line">Queued</span>':btn('editPerson','Edit','',{person:p.id},'quiet'))+'</div>';

  let h=`<section class="panel"><h2>People <span class="n num">${live.length}</span></h2><div class="people">${live.length?live.map(row).join(''):'<p class="fact muted">No people recorded.</p>'}</div>`;
  if(arch.length)h+=`<details class="archive inpanel"><summary>Archived (${arch.length})</summary><div class="arch-body">${arch.map(p=>`<div class="arch-row"><span style="font-weight:600;color:var(--fg)">${esc(p.name)}</span><span class="arch-note">${esc(p.archived_reason||'')}</span>${manageFor(pendingByPerson[p.id],btn('restorePerson','Restore','undo',{person:p.id},'quiet'))}</div>`).join('')}</div></details>`;
  if(UI.open==='addperson')h+=`<div class="picker"><div class="form-grid"><div class="field"><label for="ap-name">Name</label><input class="input" id="ap-name"></div>`+
    `<div class="field"><label for="ap-role">Role</label><input class="input" id="ap-role"></div><div class="field"><label for="ap-email">Email</label><input class="input" id="ap-email"></div>`+
    (C.sites.length?`<div class="field"><label for="ap-site">Site</label><select class="input" id="ap-site"><option value="">No site</option>${C.sites.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div>`:'')+
    `</div><div class="actions">${btn('confirmAddPerson','Add the person','',{},'primary')}${cancel()}</div></div>`;
  return h+`<div class="panel-actions">${btn('openUi','Add a person','person_add',{ui:'addperson'})}</div></section>`;

/* ---------- raising ---------- */
/* A press shows its row queued at once (a provisional intent, read by the
   same watch()), closes its choice, and refuses a second press of a job
   or a task while the first is on its way (plan 072). */
async function raise(type,payload,verb,toastText){
  const temp={id:1e15+(++sendSeq),type,payload_json:payload,status:'pending',requested_at:new Date().toISOString(),requested_by:me.email};
  const k=NXJOBS.TYPES.includes(type)||NXJOBS.TASK_TYPES.includes(type)?NXJOBS.intentKey(temp):null;
  if(k!=null&&jobPending[k]&&jobPending[k].status!=='failed')return false;
  sending.push(temp);watch(readIntents.concat(sending));
  UI.open=null;UI.edit=null;render();
  const {error}=await sb.from('engine_intents').insert({type,payload_json:payload,requested_by:me.email});
  if(error){
    sending=sending.filter(x=>x!==temp);watch(readIntents.concat(sending));render();
    NXShell.toast(`Could not queue it: ${error.message}`);return false;
  }
  NXShell.toast(toastText||`${verb}, queued. The engine acts within a minute or two.`);
  setTimeout(load,1500);
  return true;
}
/* Every Contacts payload is built from what changed, so it goes through NXCRM.pick. */
function raiseCrm(type,payload,verb){
  let clean;
  try{clean=NXCRM.pick(type,payload);}catch(e){NXShell.toast(e.message);return Promise.resolve(false);}
  return raise(type,clean,verb);
}

  async editSite(el){await loadCompanyNames();open(el,'site:'+el.dataset.site);},
  async saveSite(el){
    const s=C.sites.find(x=>String(x.id)===String(el.dataset.site));if(!s)return;
    const payload={site_id:s.id}, name=val('es-name'), town=val('es-town'), country=val('es-country');
    if(!name)return need('es-name','A site needs a name.');
    if(name!==s.name)payload.name=name;
    if(town!==(s.town||''))payload.town=town;
    if(country!==(s.country||''))payload.country=country;
    const co=val('es-co');
    if(co&&Number(co)!==C.id)payload.company_id=Number(co);
    if(Object.keys(payload).length===1){UI.open=null;render();return NXShell.toast('Nothing changed.');}
    if(await raiseCrm('edit-site',payload,payload.company_id?`${name} moved`:`${name} saved`))render();
  },
  async confirmAddSite(){
    const name=val('as-name');
    if(!name)return need('as-name','A site needs a name.');
    const payload={company_id:C.id,name}, town=val('as-town'), country=val('as-country');
    if(town)payload.town=town;
    if(country)payload.country=country;
    if(await raiseCrm('add-site',payload,`${name} added`))render();
  },
  /* the account controls, moved from Accounts (Will, 22 October 2026) */
  pauseOrg(el){open(el,'pause:'+el.dataset.orgId);},
  resumeOrg(el){open(el,'resume:'+el.dataset.orgId);},
  removeOrg(el){open(el,'remove:'+el.dataset.orgId);},
  restoreOrg(el){open(el,'restore:'+el.dataset.orgId);},
  openAuditStrike(el){open(el,'audit:'+el.dataset.orgId);},
  deleteOrg(el){open(el,'del:'+el.dataset.orgId);},
  eraseOrg(el){open(el,'erase:'+el.dataset.orgId);},
  cureStrike(el){open(el,'cure:'+el.dataset.strike);},
  deleteUser(el){open(el,'deluser:'+el.dataset.user);},
  async confirmPause(el){
    const orgId=el.dataset.orgId, reason=val('pa-why');
    if(!reason.trim())return need('pa-why','A pause carries its reason.');
    if(await raise('pause-org',{org_id:orgId,reason:reason.trim()},'Paused'))render();
  },
  async confirmResume(el){const orgId=el.dataset.orgId;if(await raise('resume-org',{org_id:orgId},'Resumed'))render();},
  async confirmRemove(el){
    const orgId=el.dataset.orgId, reason=val('rm-why');
    if(!reason.trim())return need('rm-why','A removal carries its reason.');
    if(await raise('remove-org',{org_id:orgId,reason:reason.trim()},'Removed'))render();
  },
  async confirmRestore(el){const orgId=el.dataset.orgId;if(await raise('restore-org',{org_id:orgId},'Restored'))render();},
  async confirmAudit(el){
    const orgId=el.dataset.orgId, notes=val('au-why');
    if(!notes.trim())return need('au-why','An audit strike carries its reason.');
    if(await raise('open-audit-strike',{org_id:orgId,notes:notes.trim()},'Audit strike opened'))render();
  },
  async confirmCure(el){
    const strikeId=Number(el.dataset.strike), note=val('cu-note');
    if(await raise('cure-strike',{strike_id:strikeId,note:note.trim()},'Strike cured'))render();
  },
  async confirmDelete(el){
    const orgId=el.dataset.orgId, typed=val('delName');
    if(!delMatches(typed,orgOf(el).name))return need('delName','Type the account’s name exactly to delete it.');
    if(await raise('delete-account',{org_id:orgId,confirm_name:typed},'Delete queued'))render();
  },
  async confirmErase(el){
    const orgId=el.dataset.orgId, o=orgOf(el), typed=val('erName'), reason=val('erWhy'), before=!retentionDue(o);
    if(!eraseReady(typed,o.name,reason,before))return need(delMatches(typed,o.name)?'erWhy':'erName',before?'Type the account’s name and give a reason to erase before the date.':'Type the account’s name exactly to erase the records.');
    if(await raise('erase-account',{org_id:orgId,confirm_name:typed,...(reason?{reason}:{})},'Erase queued'))render();
  },
  async confirmDeleteUser(el){const userId=el.dataset.user;if(await raise('delete-user',{user_id:userId},'Delete queued'))render();},
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act;
  if(ACT[a]){e.preventDefault();ACT[a](b);}
  else if(NXJOBS.ACT[a]){e.preventDefault();NXJOBS.ACT[a](b,jobCtx());}
});
document.addEventListener('input',e=>{
  if(e.target.id==='erName'||e.target.id==='erWhy')eraseCheck();
  if(e.target.id==='delName'){const go=$('delGo'), o=orgById(go&&go.dataset.orgId);if(go&&o)go.disabled=!delMatches(e.target.value,o.name);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.open||UI.edit)){UI.open=null;UI.edit=null;render();}});

boot();
</script>
</body>
</html>
