<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirm your new email address · The NexPoint Global Hub</title>
<link rel="icon" href="../assets/nexpoint-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- One icon subset for the whole site (check/sweep.mjs keeps it in step): a page that gains an icon adds its name here, on every page. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_circle,arrow_downward,arrow_forward,arrow_outward,check,check_circle,close,conveyor_belt,event_upcoming,expand_more,fact_check,factory,family_restroom,gavel,grid_view,group_off,groups,handshake,handyman,history,hourglass_top,hub,inbox,lan,layers,local_shipping,lock,mail,medical_services,menu,monitor_heart,my_location,payments,pending_actions,person,precision_manufacturing,print_disabled,progress_activity,public,receipt_long,school,science,storefront,swap_horiz,sync_alt,task_alt,travel_explore,trending_up,tune,verified,view_in_ar,visibility,visibility_off,warehouse&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F5F7FA;--ink:#0E1626;--muted:#5A6B84;--blue:#005CC8;--blue-hover:#0066DC;--green:#8BC53F;--border:#E3E8EF;--red:#B3261E}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--canvas);color:var(--ink);font:400 16px/1.6 'Inter',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:460px;width:100%;text-align:center}
  .mark img{height:64px;width:64px;display:block;margin:0 auto}
  .rule{width:44px;height:3px;background:var(--green);border-radius:9999px;margin:22px auto}
  h1{font:700 clamp(22px,4vw,28px)/1.25 'Montserrat',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
  p{color:var(--muted)}
  p+p{margin-top:12px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  button,.btn{font:600 14px/1 'Inter',sans-serif;padding:13px 22px;border-radius:4px;border:none;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
  .yes{background:var(--blue);color:#fff}
  .yes:hover{background:var(--blue-hover)}
  .yes[disabled]{opacity:.6;cursor:default}
  :is(a,button,input):focus-visible{outline:2px solid #3D8EEB;outline-offset:3px}
  .panel{margin-top:26px;padding:22px;background:#fff;border:1px solid var(--border);border-radius:8px;text-align:left}
  .panel .actions{justify-content:flex-start;margin-top:18px}
  .panel .field+.field{margin-top:14px}
  label{display:block;font:600 12px/1 'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input{width:100%;background:#fff;border:1px solid rgba(14,22,38,.18);border-radius:4px;color:var(--ink);
        font:400 14.5px/1.4 'Inter',sans-serif;padding:12px 14px;outline:none}
  input:focus{border-color:var(--blue)}
  /* show-password (plan 046): the eye sits inside the field, after the text */
  .np-eye{position:relative;display:block}
  .np-eye input{padding-right:44px}
  .np-eye__btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;color:var(--muted);cursor:pointer;border-radius:4px;display:inline-flex}
  .np-eye__btn:hover{color:var(--blue)}
  .np-eye__btn .material-symbols-outlined{font-size:20px;display:block}
  .err{display:none;margin-top:12px;color:var(--red);font-size:14px}
  .foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .foot a{color:var(--blue)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="../assets/nexpoint-logo.png" alt="NexPoint" width="64" height="64"></div>
    <div class="rule"></div>
    <div id="emailBody">
      <h1>One moment…</h1>
      <p>Confirming your new address.</p>
    </div>
    <div class="foot">NexPoint, the commercial bridge for Orthotics &amp; Prosthetics worldwide.<br>
      Stuck? Email <a href="mailto:hello@nexpoint.co.uk">hello@nexpoint.co.uk</a>.</div>
  </main>
<script src="assets/email-change.js"></script>
</body>
</html>
