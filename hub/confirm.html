<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirm your email · The NexPoint Global Hub</title>
<link rel="icon" href="../assets/nexpoint-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F5F7FA;--ink:#0E1626;--muted:#5A6B84;--blue:#005CC8;--blue-hover:#0066DC;--green:#8BC53F;--border:#E3E8EF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--canvas);color:var(--ink);font:400 16px/1.6 'Inter',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:460px;width:100%;text-align:center}
  .mark img{height:64px;width:64px;display:block;margin:0 auto}
  .rule{width:44px;height:3px;background:var(--green);border-radius:9999px;margin:22px auto}
  h1{font:700 clamp(22px,4vw,28px)/1.25 'Montserrat',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
  h2{font:600 17px/1.3 'Montserrat',sans-serif;letter-spacing:-.01em;margin:0 0 8px}
  p{color:var(--muted)}
  p+p{margin-top:12px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  button,.btn{font:600 14px/1 'Inter',sans-serif;padding:13px 22px;border-radius:4px;border:none;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
  .yes{background:var(--blue);color:#fff}
  .yes:hover{background:var(--blue-hover)}
  .quiet{background:transparent;color:var(--blue);border:1px solid var(--blue)}
  .quiet:hover{background:rgba(0,92,200,.08)}
  :is(a,button,input):focus-visible{outline:2px solid #3D8EEB;outline-offset:3px}
  .panel{margin-top:26px;padding:22px;background:#fff;border:1px solid var(--border);border-radius:8px;text-align:left}
  .panel .actions{justify-content:flex-start;margin-top:18px}
  label{display:block;font:600 12px/1 'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input{width:100%;background:#fff;border:1px solid rgba(14,22,38,.18);border-radius:4px;color:var(--ink);
        font:400 14.5px/1.4 'Inter',sans-serif;padding:12px 14px;outline:none}
  input:focus{border-color:var(--blue)}
  .aside{margin-top:22px;font-size:14px}
  button.linkish{background:none;border:none;padding:0;display:inline;color:var(--blue);font:600 14px/1.6 'Inter',sans-serif;text-decoration:underline;text-underline-offset:3px}
  .foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .foot a{color:var(--blue)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="../assets/nexpoint-logo.png" alt="NexPoint"></div>
    <div class="rule"></div>
    <div id="confirmBody">
      <h1>One moment…</h1>
      <p>Confirming your email.</p>
    </div>
    <div class="foot">NexPoint, the commercial bridge for Orthotics &amp; Prosthetics worldwide.<br>
      Stuck? Email <a href="mailto:hello@nexpoint.co.uk">hello@nexpoint.co.uk</a>.</div>
  </main>

<script>
/* Confirmation landing. The link in the email carries a one-time token; posting
   it back is what wakes the account up and sets the session cookie, so this is
   the only page where a hub account starts being able to act.

   It is deliberately standalone, like check.html: someone arriving here has
   just come from an email client and may have no session, no portal.css cached
   and no patience, so the page carries its own styles and one job.

   A pending action (something started before the account existed) lives in
   localStorage on the origin the visitor started on - almost always a
   subdomain, while this page is served from the apex - so this page cannot
   see it and does not try to. Instead, when the registration that led here
   carried a return_to, the worker appends it to this link as &return=, and
   this page's only job on success is to send the visitor back to it; the
   originating page (portal.js) offers the replay once it sees a confirmed,
   signed-in visitor with a pending action of its own. */
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = local ? 'http://localhost:8787' : 'https://api.nexpoint.co.uk';
const ACCOUNT_URL = /\.nexpoint\.co\.uk$/.test(location.hostname)
  ? 'https://nexpoint.co.uk/hub/account/' : '/hub/account/';
const DOOR_URL = /\.nexpoint\.co\.uk$/.test(location.hostname)
  ? 'https://nexpoint.co.uk/hub/' : '/hub/';

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

const body = () => document.getElementById('confirmBody');

function render(html){ body().innerHTML = html; }
function say(title, line){ render(`<h1>${escapeHtml(title)}</h1><p>${escapeHtml(line)}</p>`); }

function actionLink(label, href){
  return `<div class="actions"><a class="btn yes" href="${escapeHtml(href)}">${escapeHtml(label)}</a></div>`;
}
function accountLink(label){
  return actionLink(label, ACCOUNT_URL);
}

/* The confirmation email's link carries &return= when the registration that
   led here started from an action on another page (see A.gate() /
   return_to in hub-account.js). Only ever followed to a NexPoint host, so a
   crafted link cannot use this page to redirect someone elsewhere. */
function safeReturnTo(){
  const raw = new URLSearchParams(location.search).get('return');
  if (!raw) return null;
  let u;
  try { u = new URL(raw, location.href); } catch (e) { return null; }
  if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
  const host = u.hostname;
  const ok = host === 'nexpoint.co.uk' || host.endsWith('.nexpoint.co.uk') || host === 'localhost';
  return ok ? u.href : null;
}

/* The door with its sign-in box open, coming back to the same place a
   confirmation would have. */
function signInHref(){
  const dest = safeReturnTo();
  return DOOR_URL + '?signin=1' + (dest ? '&return=' + encodeURIComponent(dest) : '');
}

/* Who this device is signed in as, if anyone (audit plan 029). Asked only
   once the worker has refused the token, never instead of posting it: a
   device signed in to one account can open another account's link, and
   that link must still be used. */
async function whoAmI(){
  try {
    const r = await fetch(API + '/auth/me', { credentials: 'include' });
    const d = await r.json().catch(() => null);
    return r.ok && d ? d : null;
  } catch (e) { return null; }
}

/* ── the states ──────────────────────────────────────────────────── */

/* Both ways on, when there are two (audit plan 015). The account page was
   offered only when there was nowhere to go back to, so anyone who registered
   from a hub page never learned it existed. Going back stays the main action;
   the account sits beside it as the quieter one.

   The account is named (audit plan 029), and when the link itself was
   refused (`spent`) there is a way to a fresh one for another address: this
   device may be signed in to a different account from the one the link
   was for. */
function renderConfirmed(email, spent){
  const dest = safeReturnTo();
  const cta = dest
    ? `<div class="actions"><a class="btn yes" href="${escapeHtml(dest)}">Continue where you left off</a>` +
      `<a class="btn quiet" href="${escapeHtml(ACCOUNT_URL)}">Go to your account</a></div>`
    : accountLink('Go to your account');
  const who = email ? ` as <strong>${escapeHtml(email)}</strong>` : '';
  render(`<h1>You're confirmed.</h1><p>Your hub account is ready and you are signed in on this device${who}.</p>` + cta +
    (spent ? `<p class="aside">Registered a different address? <button class="linkish" type="button" id="needLink">Send it a new link</button></p>` +
      resendPanel() : ''));
  if (spent) wireResend();
}

/* Audit plan 029. GoTrue refuses a spent link and an expired one with the
   same answer, so this page cannot tell them apart and says both. It used to
   say only "That link has expired" beside a resend box, which told someone
   who had simply opened the link twice that their registration had failed,
   and the resend then sent nothing to their confirmed address. */
function renderUsed(){
  render(`
    <h1>This link has been used or has expired.</h1>
    <p>Confirmation links work once, and only for a short while. If you have confirmed already, sign in and carry on.</p>
    <div class="actions"><a class="btn yes" href="${escapeHtml(signInHref())}">Sign in</a>` +
    `<button class="quiet" type="button" id="needLink">Not confirmed yet? Send a new link</button></div>` +
    resendPanel());
  wireResend();
}

function resendPanel(){
  return `
    <div class="panel" id="resendPanel" hidden>
      <label for="resendEmail">Email</label>
      <input id="resendEmail" type="email" placeholder="you@company.com" autocomplete="email">
      <div class="actions"><button class="yes" type="button" id="resendBtn">Send a new link</button></div>
    </div>`;
}

function wireResend(){
  const panel = document.getElementById('resendPanel');
  document.getElementById('needLink').addEventListener('click', () => {
    panel.hidden = false;
    document.getElementById('resendEmail').focus();
  });
  document.getElementById('resendBtn').addEventListener('click', resend);
  document.getElementById('resendEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') resend(); });
}

async function resend(){
  const input = document.getElementById('resendEmail');
  const btn = document.getElementById('resendBtn');
  const email = (input.value || '').trim();
  if (!email){ input.focus(); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await fetch(API + '/auth/resend-confirmation', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
  } catch (e) { /* the worker answers every address the same way; so does this */ }
  /* It sends nothing to a confirmed address (audit plan 029), so the way on
     for that address is named too. */
  render(`<h1>Check your inbox…</h1><p>If that address still needs confirming, a fresh link is on its way. If it is already confirmed, sign in instead.</p>` +
    actionLink('Sign in', signInHref()));
}

/* ── boot ────────────────────────────────────────────────────────── */
(async function boot(){
  const q = new URLSearchParams(location.search);
  const token = q.get('t');
  const type = q.get('type');
  if (!token){
    say('Link incomplete.', 'This link is missing information. Use the link from your email, or email hello@nexpoint.co.uk.');
    return;
  }

  const payload = { token_hash: token };
  if (type) payload.type = type;

  let r, d;
  try {
    r = await fetch(API + '/auth/confirm', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    d = await r.json().catch(() => ({}));
  } catch (e) {
    say('That did not go through.', 'Check your connection and open the link again, or email hello@nexpoint.co.uk.');
    return;
  }

  if (r.ok && d && d.ok){
    /* the cookie is set now; the account can act as soon as the visitor is
       back on a page that loads hub-account.js */
    renderConfirmed(d.member && d.member.email);
    return;
  }
  /* A refused token: used already (a second open, a reload, a mail scanner
     that opened it first) or expired. A device signed in to a confirmed
     account most likely made the first click itself, so it hears that,
     with the account named; anyone else gets both ways on. */
  if (r.status === 401 || (d && d.error === 'invalid_or_expired')){
    const me = await whoAmI();
    if (me && me.signed_in && me.confirmed){ renderConfirmed(me.member && me.member.email, true); return; }
    renderUsed();
    return;
  }
  say('That did not go through.', 'Open the link from your email again, or email hello@nexpoint.co.uk and we will sort it out.');
})();
</script>
</body>
</html>
