<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirm your email · The NexPoint Global Hub</title>
<link rel="icon" href="../assets/nexpoint-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F5F7FA;--ink:#0E1626;--muted:#5A6B84;--blue:#005CC8;--blue-hover:#0066DC;--green:#8BC53F;--border:#E3E8EF;--warn:#8A5300}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--canvas);color:var(--ink);font:400 16px/1.6 'Inter',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:460px;width:100%;text-align:center}
  .mark img{height:64px;width:64px;display:block;margin:0 auto}
  .rule{width:44px;height:3px;background:var(--green);border-radius:9999px;margin:22px auto}
  h1{font:700 clamp(22px,4vw,28px)/1.25 'Montserrat',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
  h2{font:600 17px/1.3 'Montserrat',sans-serif;letter-spacing:-.01em;margin:0 0 8px}
  p{color:var(--muted)}
  p+p{margin-top:12px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  button,.btn{font:600 14px/1 'Inter',sans-serif;padding:13px 22px;border-radius:4px;border:none;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
  .yes{background:var(--blue);color:#fff}
  .yes:hover{background:var(--blue-hover)}
  .no{background:transparent;border:1px solid rgba(14,22,38,.2);color:var(--ink)}
  .no:hover{border-color:rgba(14,22,38,.4)}
  :is(a,button,input):focus-visible{outline:2px solid #3D8EEB;outline-offset:3px}
  .panel{margin-top:26px;padding:22px;background:#fff;border:1px solid var(--border);border-radius:8px;text-align:left}
  .panel .actions{justify-content:flex-start;margin-top:18px}
  label{display:block;font:600 12px/1 'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input{width:100%;background:#fff;border:1px solid rgba(14,22,38,.18);border-radius:4px;color:var(--ink);
        font:400 14.5px/1.4 'Inter',sans-serif;padding:12px 14px;outline:none}
  input:focus{border-color:var(--blue)}
  .note{margin-top:14px;font-size:13px;color:var(--warn)}
  .foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .foot a{color:var(--blue)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="../assets/nexpoint-logo.png" alt="NexPoint"></div>
    <div class="rule"></div>
    <div id="confirmBody">
      <h1>One moment…</h1>
      <p>Confirming your email.</p>
    </div>
    <div class="foot">NexPoint, the commercial bridge for Orthotics &amp; Prosthetics worldwide.<br>
      Stuck? Email <a href="mailto:hello@nexpoint.co.uk">hello@nexpoint.co.uk</a>.</div>
  </main>

<script src="../assets/hub-account.js"></script>
<script>
/* Confirmation landing. The link in the email carries a one-time token; posting
   it back is what wakes the account up and sets the session cookie, so this is
   the only page where a hub account starts being able to act.

   It is deliberately standalone, like check.html: someone arriving here has
   just come from an email client and may have no session, no portal.css cached
   and no patience, so the page carries its own styles and one job. */
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = local ? 'http://localhost:8787' : 'https://api.nexpoint.co.uk';
const ACCOUNT_URL = /\.nexpoint\.co\.uk$/.test(location.hostname)
  ? 'https://nexpoint.co.uk/hub/account/' : '/hub/account/';

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

const body = () => document.getElementById('confirmBody');

function render(html){ body().innerHTML = html; }
function say(title, line){ render(`<h1>${escapeHtml(title)}</h1><p>${escapeHtml(line)}</p>`); }

function accountLink(label){
  return `<div class="actions"><a class="btn yes" href="${ACCOUNT_URL}">${escapeHtml(label)}</a></div>`;
}

/* ── the states ──────────────────────────────────────────────────── */

function renderConfirmed(){
  const pending = window.NPAccount ? NPAccount.pending() : null;
  if (pending && pending.kind === 'request'){
    render(`
      <h1>You're confirmed.</h1>
      <p>Your hub account is ready and you are signed in on this device.</p>
      <div class="panel">
        <h2>Send the request you started?</h2>
        <p>You asked us for an introduction before you had an account. We held on to it rather than losing your place.</p>
        <div class="actions">
          <button class="yes" type="button" id="sendPendingBtn">Send it now</button>
          <button class="no" type="button" id="skipPendingBtn">Not now</button>
        </div>
      </div>`);
    document.getElementById('sendPendingBtn').addEventListener('click', sendPending);
    document.getElementById('skipPendingBtn').addEventListener('click', () => {
      NPAccount.clearPending();
      render(`<h1>You're confirmed.</h1><p>Your hub account is ready. Ask for the introduction whenever you are ready.</p>` + accountLink('Go to your account'));
    });
    return;
  }
  render(`<h1>You're confirmed.</h1><p>Your hub account is ready and you are signed in on this device.</p>` + accountLink('Go to your account'));
}

async function sendPending(){
  const btn = document.getElementById('sendPendingBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const d = await NPAccount.replayPending();
  if (d && d.ok){
    render(`<h1>Received, in confidence.</h1><p>Chris or Will reads every request personally. Expect to hear within two working days.</p>` + accountLink('Go to your account'));
    return;
  }
  btn.disabled = false; btn.textContent = 'Send it now';
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = d && d.error === 'network'
    ? 'That did not send. Check your connection and try again.'
    : 'That did not send. Try again, or email hello@nexpoint.co.uk.';
  btn.parentNode.parentNode.appendChild(note);
}

function renderExpired(){
  render(`
    <h1>That link has expired.</h1>
    <p>Confirmation links last a short while only, and each one can be used once. Put your email in below and we will send a fresh one.</p>
    <div class="panel">
      <label for="resendEmail">Email</label>
      <input id="resendEmail" type="email" placeholder="you@company.com" autocomplete="email">
      <div class="actions"><button class="yes" type="button" id="resendBtn">Send a new link</button></div>
    </div>`);
  document.getElementById('resendBtn').addEventListener('click', resend);
  document.getElementById('resendEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') resend(); });
}

async function resend(){
  const input = document.getElementById('resendEmail');
  const btn = document.getElementById('resendBtn');
  const email = (input.value || '').trim();
  if (!email){ input.focus(); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await fetch(API + '/auth/resend-confirmation', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
  } catch (e) { /* the worker answers every address the same way; so does this */ }
  render(`<h1>Check your inbox…</h1><p>If that email has an account waiting, a fresh confirmation link is on its way to it.</p>`);
}

/* ── boot ────────────────────────────────────────────────────────── */
(async function boot(){
  const q = new URLSearchParams(location.search);
  const token = q.get('t');
  const type = q.get('type');
  if (!token){
    say('Link incomplete.', 'This link is missing information. Use the link from your email, or email hello@nexpoint.co.uk.');
    return;
  }

  const payload = { token_hash: token };
  if (type) payload.type = type;

  let r, d;
  try {
    r = await fetch(API + '/auth/confirm', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    d = await r.json().catch(() => ({}));
  } catch (e) {
    say('That did not go through.', 'Check your connection and open the link again, or email hello@nexpoint.co.uk.');
    return;
  }

  if (r.ok && d && d.ok){
    /* the cookie is set now, so the module can pick the account up and any
       held action can be finished from here */
    if (window.NPAccount) await NPAccount.refresh();
    renderConfirmed();
    return;
  }
  if (d && d.error === 'already_confirmed'){
    render(`<h1>Already confirmed.</h1><p>This email was confirmed already. Nothing more to do here.</p>` + accountLink('Go to your account'));
    return;
  }
  if (r.status === 401 || (d && d.error === 'invalid_or_expired')){ renderExpired(); return; }
  say('That did not go through.', 'Open the link from your email again, or email hello@nexpoint.co.uk and we will sort it out.');
})();
</script>
</body>
</html>
