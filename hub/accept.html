<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your account · The NexPoint Global Portal</title>
<link rel="icon" href="../assets/nexpoint-logo.png">
<script>
  /* Plan 055 (decision 19): the provider answers an introduction on its
     account page, so the old emailed link (?intro=&token=) lands on that
     page, at the introduction it named. Nothing is read from the token. */
  (function () {
    var id = new URLSearchParams(location.search).get('intro') || '';
    location.replace(/^\d+$/.test(id) ? '/hub/account/#intro-' + id : '/hub/account/');
  })();
</script>
</head>
<body>
<p>Opening your account… <a href="/hub/account/">Go to your account</a></p>
</body>
</html>
