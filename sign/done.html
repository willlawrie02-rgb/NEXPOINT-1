<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Signing finished · NexPoint</title>
<link rel="icon" href="../assets/nexpoint-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F5F7FA;--ink:#0E1626;--muted:#5A6B84;--green:#8BC53F}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--canvas);color:var(--ink);font:400 16px/1.6 'Inter',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .mark img{height:48px;width:48px;display:block;margin:0 auto}
  .rule{width:44px;height:3px;background:var(--green);border-radius:9999px;margin:18px auto}
  h1{font:700 22px/1.25 'Montserrat',sans-serif;letter-spacing:-.02em;margin:0 0 10px}
  p{color:var(--muted)}
</style>
</head>
<body>
  <main>
    <div class="mark"><img src="../assets/nexpoint-logo.png" alt="NexPoint" width="48" height="48"></div>
    <div class="rule"></div>
    <h1>Signing finished.</h1>
    <p>You can close this window.</p>
  </main>
<script>
/* DocuSign's return address for the sign-up page's focused view. When it
   loads inside the signing frame, it tells the page around it (same origin
   only) that the session ended, with DocuSign's ?event= when there is one;
   the page then finishes as it does on DocuSign's own sessionEnd, whichever
   arrives first. Opened on its own, it only says the window can close. */
(function () {
  'use strict';
  if (!window.parent || window.parent === window) return;
  var event = new URLSearchParams(location.search).get('event') || '';
  try { window.parent.postMessage({ source: 'np-sign-done', event: event }, location.origin); } catch (e) { /* nothing to tell */ }
})();
</script>
</body>
</html>
